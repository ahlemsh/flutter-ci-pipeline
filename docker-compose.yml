services:

  flutter-ci:
    build:
      context: .
      dockerfile: Dockerfile

    image: safedocs-flutter-ci:3.47.2

    working_dir: /workspace

    volumes:
      - .:/src:ro
      - ./docker-output:/output

    command: >
      bash -lc "
      cp -a /src/. /workspace/ &&
      cd /workspace &&
      rm -rf .dart_tool build &&
      flutter pub get &&
      flutter analyze --no-fatal-infos --no-fatal-warnings &&
      flutter test &&
      flutter build apk --debug &&
      mkdir -p /output &&
      cp build/app/outputs/flutter-apk/app-debug.apk
      /output/safedocs-dev.apk
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: safedocs-backend-ci:dev

    working_dir: /app

    volumes:
      - ./backend:/app

    command: >
      sh -c "
      python -m compileall app &&
      python -m pytest
      "